apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb-uid
    url: timescaledb:5432
    user: grafana_ro
    secureJsonData:
      password: GrafanaRo_SecurePass1!
    jsonData:
      database: anomaly_db
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
      timescaledbVersion: '2'
    isDefault: true
