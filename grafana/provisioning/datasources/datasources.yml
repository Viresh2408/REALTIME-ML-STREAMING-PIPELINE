apiVersion: 1

datasources:
  # ── TimescaleDB (PostgreSQL) ──────────────────────────────────────────────
  - name: TimescaleDB
    type: postgres
    uid: timescaledb-uid
    url: timescaledb:5432
    user: ${TIMESCALE_GRAFANA_USER}
    secureJsonData:
      password: ${TIMESCALE_GRAFANA_PASSWORD}
    jsonData:
      database: ${TIMESCALE_DB}
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true

  # ── Prometheus ────────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    url: http://prometheus:9090
    access: proxy
    jsonData:
      httpMethod: POST
      queryTimeout: 60s

  # ── Loki (Log Aggregation) ────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki-uid
    url: http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000
