[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomaly-detection-system"
version = "0.1.0"
description = "Real-Time Anomaly Detection & Recommendation System — ML Streaming Pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Anomaly Detection Team" }
]
keywords = ["anomaly-detection", "kafka", "fastapi", "langgraph", "timescaledb", "ml-streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ─────────────────────────────────────────────────────────────────────────────
# Core runtime dependencies
# Versions pinned from techstack.docx sections 2 (Backend & API),
# 3 (Machine Learning), and 6 (Agent Framework)
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    # ── Section 2: Backend & API ──────────────────────────────────────────────
    "fastapi==0.111.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "confluent-kafka==2.4.0",
    "sqlalchemy[asyncio]==2.0.30",
    "asyncpg==0.29.0",
    "uvicorn[standard]==0.29.0",
    "gunicorn==22.0.0",
    # HTTP client for internal service calls
    "httpx==0.27.0",
    # WebSocket support
    "websockets==12.0",
    # Auth / JWT
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    # Redis client
    "redis[hiredis]==5.0.4",
    # Avro / Schema Registry
    "fastavro==1.9.4",
    "confluent-kafka[avro,schemaregistry]==2.4.0",

    # ── Section 3: Machine Learning ───────────────────────────────────────────
    "scikit-learn==1.5.0",
    "torch==2.3.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "river==0.21.2",
    "mlflow==2.13.0",
    "joblib==1.4.2",
    # MinIO / S3 client for artifact storage
    "boto3==1.34.101",
    "minio==7.2.7",

    # ── Section 6: Agent Framework ────────────────────────────────────────────
    "langgraph==0.1.19",
    "langchain==0.2.1",
    "langchain-anthropic==0.1.11",
    "anthropic==0.26.0",
    "apscheduler==3.10.4",

    # ── Supporting utilities ──────────────────────────────────────────────────
    "python-dotenv==1.0.1",
    "structlog==24.2.0",
    "tenacity==8.3.0",
    "orjson==3.10.3",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.24.0",
    "opentelemetry-sdk==1.24.0",
]

# ─────────────────────────────────────────────────────────────────────────────
# Optional / extras
# ─────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]

# Development & CI (Section 7 of techstack.docx)
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "testcontainers",
    "httpx==0.27.0",       # async test client for FastAPI
    "faker==25.2.0",
    "factory-boy==3.3.0",
    "pre-commit==3.7.1",
    "ruff",
    "mypy==1.10.0",
    "types-redis==4.6.0.20240425",
    "ipython==8.24.0",
    "locust==2.28.0",
]

# Load testing only
load = [
    "locust==2.28.0",
]

# GPU support (optional for autoencoder training)
gpu = [
    "torch==2.3.0+cu121",
]

# ─────────────────────────────────────────────────────────────────────────────
# Tool configuration
# ─────────────────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["backend", "agents", "ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
    "--cov=backend",
    "--cov=agents",
    "--cov=ml",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests requiring running services (Kafka, TimescaleDB)",
    "load: Locust load/stress tests",
    "slow: tests taking more than 5 seconds",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",    # use of assert in tests
    "ANN201",  # missing return type — too noisy across agent scripts
    "ANN401",  # Any is intentional in generic helpers & worker internals
    "T201",    # print() is intentional in standalone scripts / agents
    "RUF002",  # en-dash in docstrings is stylistic, not a bug
    "RUF003",  # en-dash in comments is stylistic, not a bug
]

[tool.ruff.lint.per-file-ignores]
# ── Tests & verification scripts ──────────────────────────────
"tests/**"                           = ["ANN", "S", "T20", "N801", "B017", "F841", "RUF059", "E501", "E701"]
"tests/verify_pipeline.py"           = ["ANN", "S", "T20", "N806", "F401", "F841", "RUF059", "E501", "E701"]
"verify_timescaledb.py"              = ["ANN", "T20", "S", "E501"]
# ── Agent scripts (standalone, print-heavy, dynamic config) ───
"agents/**"                          = ["ANN", "T20", "S104", "S603", "S105", "S107", "RUF006", "E501", "B904", "E402"]
# ── ML models (scientific naming: X, X_train, X_val are conventional) ─
"ml/models/**"                       = ["N803", "N806", "ANN", "E501"]
"ml/inference.py"                    = ["N806", "ANN", "T20", "E501"]
"ml/inference/**"                    = ["N806", "ANN", "T20", "E501"]
"ml/train.py"                        = ["N806", "T20", "ANN"]
"ml/test_inference_pipeline.py"      = ["N806", "E402", "ANN", "T20", "S"]
"ml/training/**"                     = ["N806", "N803", "N805", "ANN", "T20", "E501"]
"ml/data/**"                         = ["ANN", "T20", "S"]
# ── Worker internals (sys.path manipulation required before imports) ─
"ml/worker/inference_worker.py"      = ["E402", "N806", "B905", "B023", "RUF059", "S110", "ANN"]
"ml/worker/hot_reload.py"            = ["ANN", "S110", "W293"]
"ml/worker/preprocessor.py"         = ["ANN"]
# ── Backend API (FastAPI/SQLAlchemy patterns, mock data generation) ─
"backend/**"                         = ["ANN", "E501", "S110", "S105", "S107", "S608", "B904", "B008", "S311", "UP042", "RUF001", "RUF012", "E402", "RUF022"]
# ── MCP servers (dynamic API bridge scripts) ───────────────────
"mcp/**"                             = ["ANN", "E501", "S608", "F841"]
# ── Infra scripts (one-off setup, no strict lint needed) ───────
"infra/**"                           = ["ANN", "T20", "S", "E501"]
# ── Migration SQL ──────────────────────────────────────────────
"**/migrations/**"                   = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "agents", "ml"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "ml.data.download_cicids",
    "ml.training.online_learner",
    "backend.app.core.redis_client",
    "ml.training.train_autoencoder",
    "backend.app.api.v1.anomalies",
    "ml.inference.engine",
    "ml.worker.inference_worker",
    "ml.inference.worker"
]
ignore_errors = true

[tool.coverage.run]
source = ["backend", "agents", "ml"]
omit = ["*/tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
