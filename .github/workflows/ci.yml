name: CI — Anomaly Detection System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/anomaly-detection
  # Opt into Node.js 24 now to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Lint & Type Check
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install "ruff" "mypy==1.10.0"

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        run: mypy backend/ agents/ ml/ --ignore-missing-imports

  # ────────────────────────────────────────────────────────────
  # 2. Unit Tests
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade setuptools
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -m unit \
            --cov=backend --cov=agents --cov=ml \
            --cov-report=xml \
            --cov-fail-under=0

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  # ────────────────────────────────────────────────────────────
  # 3. Integration Tests (testcontainers)
  # ────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade setuptools
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration --no-cov
        env:
          TESTING: "true"
          JWT_SECRET_KEY: "ci-test-secret-key-minimum-32-chars-here"
          ANTHROPIC_API_KEY: "sk-ant-test-key"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_pw@localhost:5432/test_db"
          TIMESCALE_PASSWORD: "test_pw"

  # ────────────────────────────────────────────────────────────
  # 4. Build & Push Docker Images
  # ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      # GHCR requires all-lowercase repository names.
      # github.repository_owner may contain uppercase letters (e.g. "Viresh2408"),
      # so we normalise it here and expose it as IMAGE_LC for the tag lines below.
      - name: Set lowercase image prefix
        run: |
          echo "IMAGE_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/anomaly-detection" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push fastapi-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ml-inference-worker
        uses: docker/build-push-action@v5
        with:
          context: ./ml
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}-ml-worker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}-ml-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
